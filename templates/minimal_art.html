<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiWork - Aesthetic Minimal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* ফুল পেজ রেসপন্সিভ ব্যাকগ্রাউন্ড ইমেজ */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: url('https://i.ibb.co.com/qL09LS8S/Add-Text-09-06-05-15-02.jpg') no-repeat center center fixed;
            background-size: cover;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col justify-between p-8 sm:p-12 text-white select-none">

    <!-- টপ টেক্সট / এলিমেন্ট [__] -->
    <div class="flex items-center justify-start">
        <span class="text-sm sm:text-base font-mono font-bold tracking-widest text-emerald-100/70 backdrop-blur-xs bg-black/10 px-3 py-1 rounded-xl border border-white/10">
        
        </span>
    </div>

    <!-- বটম টেক্সট / এলিমেন্ট ДК -->
    <div class="flex items-center justify-between">
        <div class="space-y-0.5">
            <span class="text-xs sm:text-sm font-black tracking-widest text-emerald-200/80 uppercase">
                ДК
            </span>
        </div>
    </div>

</body>
</html>
