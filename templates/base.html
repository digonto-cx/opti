<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiWork - Cloud Mining & Earning Platform</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Tailwind Ruby Crimson Theme Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        ruby: {
                            50: '#FFF1F2',
                            100: '#FFE4E6',
                            200: '#FECDD3',
                            500: '#F43F5E',
                            600: '#E11D48',
                            700: '#BE123C',
                            800: '#9F1239',
                            900: '#881337',
                        }
                    },
                    boxShadow: {
                        'glow-ruby': '0 10px 30px -5px rgba(225, 29, 72, 0.35)',
                        'card-soft': '0 20px 40px -15px rgba(225, 29, 72, 0.07), 0 1px 3px rgba(0,0,0,0.02)',
                        'nav-float': '0 15px 35px -5px rgba(15, 23, 42, 0.12)',
                        'support-glow': '0 10px 25px -3px rgba(34, 158, 217, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        /* ডট মুক্ত আল্ট্রা-সফট লাক্সারি গ্লাস গ্রেডিয়েন্ট */
        body {
            background-color: #FFF9FA;
            background-image: 
                radial-gradient(at 0% 0%, rgba(254, 205, 211, 0.45) 0px, transparent 55%),
                radial-gradient(at 100% 0%, rgba(255, 228, 230, 0.5) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(255, 241, 242, 0.65) 0px, transparent 60%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.95);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(254, 205, 211, 0.45);
        }
        .glass-bottom-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(254, 205, 211, 0.8);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #FFF1F2; }
        ::-webkit-scrollbar-thumb { background: #FDA4AF; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased overflow-x-hidden pb-28 selection:bg-ruby-600 selection:text-white">

    <!-- Ambient Mesh Glow Lights -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-rose-200/30 via-red-100/20 to-pink-200/30 blur-[130px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-10 right-[-100px] w-[450px] h-[350px] bg-rose-100/40 blur-[140px] pointer-events-none -z-10"></div>

    <!-- ============================================== -->
    <!-- 1. TOP HEADER                                  -->
    <!-- ============================================== -->
    <header class="sticky top-0 z-40 glass-header px-4 sm:px-8 py-3 flex items-center justify-between shadow-xs">
        <!-- Left: Toggle Menu + Brand Logo -->
        <div class="flex items-center gap-3">
            <button id="drawer-toggle-btn" class="w-10 h-10 rounded-2xl bg-white border border-rose-200/80 shadow-xs flex items-center justify-center text-slate-700 hover:text-ruby-600 hover:border-ruby-300 transition active:scale-95 duration-150">
                <i class="fa-solid fa-bars-staggered text-base"></i>
            </button>
            
            <a href="/dashboard" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-ruby-600 flex items-center justify-center text-white shadow-glow-ruby">
                    <i class="fa-solid fa-fire text-sm"></i>
                </div>
                <span class="text-lg font-black tracking-tight text-slate-900">
                    OPTI<span class="text-ruby-600">WORK</span>
                </span>
            </a>
        </div>

        <!-- Right: Balance Pill + Notifications + Profile Pic -->
        <div class="flex items-center gap-2.5">
            {% if user %}
            <!-- Clean Balance Pill -->
            <a href="/history" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-2xl bg-white border border-rose-200/80 shadow-xs text-xs font-bold text-slate-700 hover:border-ruby-300 transition active:scale-95 duration-150">
                <i class="fa-solid fa-coins text-amber-500 text-[11px]"></i>
                <span>৳<strong class="text-slate-900 ml-0.5">{{ user.balance }}</strong></span>
            </a>
            
            <!-- Notification Bell -->
            <a href="/updates" class="relative w-9 h-9 rounded-2xl bg-white border border-rose-200/80 shadow-xs flex items-center justify-center text-slate-600 hover:text-ruby-600 transition active:scale-95 duration-150">
                <i class="fa-solid fa-bell text-xs"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-ruby-600 rounded-full animate-ping"></span>
                <span class="absolute top-2 right-2 w-2 h-2 bg-ruby-600 rounded-full"></span>
            </a>

            <!-- Profile Avatar -->
            <a href="/profile" class="relative group active:scale-95 duration-150">
                <img src="{{ user.avatar_url or 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80' }}" alt="Avatar" class="w-9 h-9 rounded-2xl object-cover ring-2 ring-ruby-500/20 group-hover:ring-ruby-500 transition shadow-xs">
                <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
            </a>
            {% else %}
            <a href="/login" class="px-4 py-2 rounded-xl bg-ruby-600 text-white font-extrabold text-xs shadow-glow-ruby">লগইন</a>
            {% endif %}
        </div>
    </header>

    <!-- ============================================== -->
    <!-- 2. SLIDE-OUT DRAWER MENU                       -->
    <!-- ============================================== -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="side-drawer" class="fixed top-0 left-0 bottom-0 w-72 sm:w-80 bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-6">
        <div>
            <!-- Drawer Header -->
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-ruby-600 flex items-center justify-center text-white shadow-glow-ruby">
                        <i class="fa-solid fa-fire text-sm"></i>
                    </div>
                    <span class="text-lg font-black text-slate-900">OPTI<span class="text-ruby-600">WORK</span></span>
                </div>
                <button id="drawer-close-btn" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-rose-100 hover:text-ruby-600 flex items-center justify-center active:scale-95 duration-150">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Drawer Links -->
            <nav class="mt-5 space-y-1 text-xs font-bold text-slate-600">
                <a href="/dashboard" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-house text-sm w-5"></i> ড্যাশবোর্ড হোম
                </a>
                <a href="/tasks" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-list-check text-sm w-5"></i> সকল টাস্ক
                </a>
                <a href="/store" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-store text-sm w-5"></i> হার্ডওয়্যার স্টোর
                </a>
                <a href="/history" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-clock-rotate-left text-sm w-5"></i> আয় ও ট্রানজেকশন
                </a>
                <a href="/referrals" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-gift text-sm w-5"></i> রেফারেল সেন্টার
                </a>
                <a href="/profile" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-solid fa-user-gear text-sm w-5"></i> প্রোফাইল সেটিংস
                </a>
                <a href="https://t.me/Optiworkhelp" target="_blank" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-rose-50 hover:text-ruby-600 transition active:scale-95 duration-150">
                    <i class="fa-brands fa-telegram text-sm text-sky-500 w-5"></i> টেলিগ্রাম হেল্প সাপোর্ট
                </a>
            </nav>
        </div>

        <!-- Drawer Bottom User Status -->
        <div class="pt-4 border-t border-slate-100">
            <a href="/logout" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-xs font-bold text-slate-700 hover:text-ruby-600 transition flex items-center justify-center gap-2 active:scale-95 duration-150">
                <i class="fa-solid fa-right-from-bracket"></i> লগআউট করুন
            </a>
        </div>
    </aside>

    <!-- ============================================== -->
    <!-- 3. MAIN INJECTED CONTENT                       -->
    <!-- ============================================== -->
    <main class="max-w-4xl mx-auto px-4 pt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================== -->
    <!-- 4. 24/7 FIXED FLOATING LIVE SUPPORT WIDGET     -->
    <!-- ============================================== -->
    <div class="fixed bottom-24 right-4 sm:bottom-8 sm:right-8 z-40">
        <a href="https://t.me/Optiworkhelp" target="_blank" 
           class="group flex items-center gap-2 bg-gradient-to-r from-[#229ED9] to-[#1E88E5] text-white p-3 sm:px-4 sm:py-3 rounded-full shadow-support-glow hover:scale-105 active:scale-95 transition-all duration-200 relative overflow-hidden"
           title="২৪/৭ লাইভ সাপোর্ট">
            <!-- গ্লো ব্লিঙ্ক ইফেক্ট -->
            <span class="absolute inset-0 rounded-full bg-white/20 animate-ping pointer-events-none"></span>
            
            <i class="fa-brands fa-telegram text-xl sm:text-lg"></i>
            <span class="hidden sm:inline text-xs font-black tracking-wider uppercase">Live Support</span>
            <span class="w-2 h-2 rounded-full bg-emerald-300 shadow-[0_0_8px_#6ee7b7] animate-pulse"></span>
        </a>
    </div>

    <!-- ============================================== -->
    <!-- 5. FLOATING GLASS BOTTOM NAVIGATION BAR        -->
    <!-- ============================================== -->
    <nav class="fixed bottom-4 left-4 right-4 z-40 max-w-md mx-auto glass-bottom-nav rounded-full shadow-nav-float px-3 py-2">
        <div class="flex items-center justify-around text-center">
            
            <!-- Tab 1: Home -->
            <a href="/dashboard" class="nav-item flex flex-col items-center gap-0.5 text-slate-400 hover:text-ruby-600 font-bold text-[10px] transition group py-1 px-2.5 active:scale-95 duration-150">
                <i class="fa-solid fa-house text-base group-hover:scale-110 transition-transform"></i>
                <span>হোম</span>
            </a>

            <!-- Tab 2: Tasks -->
            <a href="/tasks" class="nav-item flex flex-col items-center gap-0.5 text-slate-400 hover:text-ruby-600 font-bold text-[10px] transition group py-1 px-2.5 active:scale-95 duration-150">
                <i class="fa-solid fa-list-check text-base group-hover:scale-110 transition-transform"></i>
                <span>টাস্ক</span>
            </a>

            <!-- Center Fast Action Button (Withdraw) -->
            <a href="/withdraw" class="flex flex-col items-center -mt-6 group active:scale-90 duration-150">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-ruby-700 via-ruby-600 to-rose-500 text-white flex items-center justify-center text-lg shadow-glow-ruby group-hover:scale-105 transition-all">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </div>
                <span class="text-[9px] font-black text-ruby-600 mt-1 uppercase tracking-wider">উইথড্র</span>
            </a>

            <!-- Tab 3: Refer -->
            <a href="/referrals" class="nav-item flex flex-col items-center gap-0.5 text-slate-400 hover:text-ruby-600 font-bold text-[10px] transition group py-1 px-2.5 active:scale-95 duration-150">
                <i class="fa-solid fa-gift text-base group-hover:scale-110 transition-transform"></i>
                <span>রেফার</span>
            </a>

            <!-- Tab 4: Account -->
            <a href="/profile" class="nav-item flex flex-col items-center gap-0.5 text-slate-400 hover:text-ruby-600 font-bold text-[10px] transition group py-1 px-2.5 active:scale-95 duration-150">
                <i class="fa-solid fa-circle-user text-base group-hover:scale-110 transition-transform"></i>
                <span>একাউন্ট</span>
            </a>
            
        </div>
    </nav>

    <!-- ============================================== -->
    <!-- 6. GLOBAL SCRIPTS                              -->
    <!-- ============================================== -->
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Vanilla Tilt JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <script>
        AOS.init({ once: true, duration: 600 });

        // Drawer Toggle Handlers
        const drawer = document.getElementById('side-drawer');
        const backdrop = document.getElementById('drawer-backdrop');
        const openBtn = document.getElementById('drawer-toggle-btn');
        const closeBtn = document.getElementById('drawer-close-btn');

        function toggleDrawer(open) {
            if (open) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        if (openBtn) openBtn.addEventListener('click', () => toggleDrawer(true));
        if (closeBtn) closeBtn.addEventListener('click', () => toggleDrawer(false));
        if (backdrop) backdrop.addEventListener('click', () => toggleDrawer(false));

        // Active Bottom Nav Highlighter
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname;
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (currentPath === href || (currentPath === '/' && href === '/dashboard')) {
                    item.classList.remove('text-slate-400');
                    item.classList.add('text-ruby-600', 'font-black');
                }
            });
        });
    </script>
</body>
</html>
