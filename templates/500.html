<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - সার্ভার সংযোগ সাময়িক সমস্যা | OptiWork</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Vanilla Tilt JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <!-- Tailwind Ruby Theme Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        ruby: {
                            50: '#FFF1F2',
                            100: '#FFE4E6',
                            200: '#FECDD3',
                            500: '#F43F5E',
                            600: '#E11D48',
                            700: '#BE123C',
                            800: '#9F1239',
                            900: '#881337',
                        }
                    },
                    boxShadow: {
                        'glow-ruby': '0 10px 30px -5px rgba(225, 29, 72, 0.4)',
                        'card-soft': '0 25px 50px -15px rgba(225, 29, 72, 0.12), 0 1px 3px rgba(0,0,0,0.02)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF9FA;
            background-image: 
                radial-gradient(at 0% 0%, rgba(254, 205, 211, 0.5) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(255, 228, 230, 0.6) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 241, 242, 0.7) 0px, transparent 60%);
            background-attachment: fixed;
        }
        .glass-panel-500 {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.95);
        }
        @keyframes gearRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes gearRotateRev {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        .gear-spin {
            animation: gearRotate 6s linear infinite;
        }
        .gear-spin-rev {
            animation: gearRotateRev 6s linear infinite;
        }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen p-4 py-8 selection:bg-ruby-600 selection:text-white">

    <!-- গ্লাস ইনফোগ্রাফিক ৫০০ কার্ড -->
    <div class="glass-panel-500 p-7 sm:p-9 rounded-[36px] shadow-card-soft max-w-md w-full text-center relative overflow-hidden border border-white space-y-6" data-tilt data-tilt-max="4" data-tilt-speed="400">
        
        <!-- সফট ব্যাকগ্রাউন্ড গ্লো -->
        <div class="absolute -right-12 -top-12 w-44 h-44 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -left-12 -bottom-12 w-44 h-44 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- ব্র্যান্ড হেডার -->
        <div class="flex items-center justify-center gap-2 relative z-10">
            <div class="w-7 h-7 rounded-xl bg-ruby-600 flex items-center justify-center text-white shadow-glow-ruby">
                <i class="fa-solid fa-fire text-xs"></i>
            </div>
            <span class="text-sm font-black tracking-wider text-slate-900 uppercase">
                OPTI<span class="text-ruby-600">WORK</span> ⚡
            </span>
        </div>

        <!-- ইনফোগ্রাফিক অ্যানিমেটেড মেকানিক্যাল গিয়ার বক্স -->
        <div class="relative w-28 h-28 mx-auto flex items-center justify-center z-10">
            <!-- গিয়ার ১ -->
            <i class="fa-solid fa-gear gear-spin text-amber-500 text-4xl absolute -top-1 -left-1 opacity-80"></i>
            <!-- গিয়ার ২ -->
            <i class="fa-solid fa-gear gear-spin-rev text-rose-500 text-3xl absolute -bottom-1 -right-1 opacity-80"></i>
            
            <!-- সেন্টার হার্ডওয়্যার আইকন -->
            <div class="w-16 h-16 rounded-2xl bg-white border border-amber-200 shadow-sm flex items-center justify-center text-amber-600 text-2xl relative z-20">
                <i class="fa-solid fa-server animate-pulse"></i>
            </div>
        </div>

        <!-- টেক্সট ইনফরমেশন -->
        <div class="space-y-1.5 relative z-10">
            <div class="flex items-center justify-center gap-2">
                <span class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">500</span>
                <span class="px-2.5 py-0.5 rounded-md bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-black uppercase tracking-wider">Internal Error</span>
            </div>
            <h2 class="text-sm font-black text-slate-900">সার্ভার সাময়িক সংযোগ সমস্যা</h2>
            <p class="text-[11px] text-slate-500 font-medium leading-relaxed max-w-xs mx-auto">
                সার্ভারে সাময়িক টেকনিক্যাল লোড বা সংযোগ বিচ্ছিন্নতা ঘটেছে। আমাদের ইঞ্জিনিয়ার টিম দ্রুত মেরামতে কাজ করছে।
            </p>
        </div>

        <!-- ইনফোগ্রাফিক সার্ভার আর্কিটেকচার স্ট্যাটাস -->
        <div class="grid grid-cols-3 gap-2 bg-white/70 border border-amber-100 p-3 rounded-2xl text-[10px] font-bold text-slate-700 relative z-10 shadow-2xs">
            <div class="text-center space-y-0.5">
                <span class="text-slate-400 block text-[8px] uppercase">Cloud DB</span>
                <span class="text-emerald-600 flex items-center justify-center gap-1"><i class="fa-solid fa-circle text-[6px]"></i> Active</span>
            </div>
            <div class="text-center space-y-0.5 border-x border-amber-100">
                <span class="text-slate-400 block text-[8px] uppercase">Node Ping</span>
                <span class="text-amber-600">Reconnecting</span>
            </div>
            <div class="text-center space-y-0.5">
                <span class="text-slate-400 block text-[8px] uppercase">Recovery</span>
                <span class="text-sky-600">Auto</span>
            </div>
        </div>

        <!-- অ্যাকশন বাটন গ্রুপ -->
        <div class="space-y-2.5 pt-1 relative z-10">
            <button onclick="location.reload()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-ruby-600 via-rose-600 to-red-600 hover:opacity-95 text-white font-black text-xs shadow-glow-ruby transition active:scale-95 duration-150 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-rotate text-xs"></i>
                <span>পেজটি রিফ্রেশ করুন</span>
            </button>

            <!-- হেল্পলাইন লিঙ্ক -->
            <a href="https://t.me/helpline_opti" target="_blank" class="w-full py-3 rounded-2xl bg-white border border-rose-200 text-slate-800 hover:bg-rose-50 font-extrabold text-xs shadow-xs transition active:scale-95 duration-150 flex items-center justify-center gap-2">
                <i class="fa-brands fa-telegram text-sky-500 text-sm"></i>
                <span>টেলিগ্রাম হেল্পলাইন সাপোর্ট</span>
            </a>
        </div>

    </div>

</body>
</html>
